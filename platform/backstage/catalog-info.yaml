# Backstage 카탈로그 — 서비스 4개와 각 API, 소유자, 의존 관계. 세미나 3번 항목(디스커버리·카탈로그).
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: hindsight
  description: 유튜버가 말한 종목, 그 뒤에 어떻게 됐나
spec:
  owner: team-hindsight
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: market-data
  description: 종목 사전(국내·미국·코인·지수 + 별칭) · 일별 시세 (최하층, 아무도 부르지 않음)
  annotations: { github.com/project-slug: insung1939/hindsight }
  tags: [python, fastapi]
spec:
  type: service
  lifecycle: experimental
  owner: team-b
  system: hindsight
  providesApis: [market-data-api]
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: { name: market-data-api }
spec:
  type: openapi
  lifecycle: experimental
  owner: team-b
  system: hindsight
  definition:
    $text: https://github.com/insung1939/hindsight/blob/main/contracts/market-data.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: youtube
  description: 추적 채널과 영상 메타데이터 수집 (최하층)
  annotations: { github.com/project-slug: insung1939/hindsight }
spec:
  type: service
  lifecycle: experimental
  owner: team-a
  system: hindsight
  providesApis: [youtube-api]
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: { name: youtube-api }
spec:
  type: openapi
  lifecycle: experimental
  owner: team-a
  system: hindsight
  definition:
    $text: https://github.com/insung1939/hindsight/blob/main/contracts/youtube.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: mentions
  description: 영상 제목·설명에서 종목 매칭
  annotations: { github.com/project-slug: insung1939/hindsight }
spec:
  type: service
  lifecycle: experimental
  owner: team-c
  system: hindsight
  providesApis: [mentions-api]
  consumesApis: [youtube-api, market-data-api]
  dependsOn: [component:youtube, component:market-data]
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: { name: mentions-api }
spec:
  type: openapi
  lifecycle: experimental
  owner: team-c
  system: hindsight
  definition:
    $text: https://github.com/insung1939/hindsight/blob/main/contracts/mentions.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: stats
  description: 언급 뒤 5·20·60 거래일 수익률과 초과수익, 요약 캐시
  annotations: { github.com/project-slug: insung1939/hindsight }
spec:
  type: service
  lifecycle: experimental
  owner: team-d
  system: hindsight
  providesApis: [stats-api]
  consumesApis: [mentions-api, market-data-api]
  dependsOn: [component:mentions, component:market-data]
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata: { name: stats-api }
spec:
  type: openapi
  lifecycle: experimental
  owner: team-d
  system: hindsight
  definition:
    $text: https://github.com/insung1939/hindsight/blob/main/contracts/stats.yaml
