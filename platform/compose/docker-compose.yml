# 로컬 통합 실행 — 서비스 5개를 컨테이너로 띄운다 (SQLite, 볼륨에 보존).
#   docker compose -f platform/compose/docker-compose.yml up --build
# 세미나 트랙에서 APISIX · OTel Collector · Grafana 를 여기에 덧붙인다 (7주차).
name: hindsight

x-common: &common
  restart: unless-stopped
  environment: &env
    ALLOWED_ORIGINS: http://localhost:5173
    INTERNAL_TOKEN: dev-token
    MARKET_DATA_URL: http://market-data:8000
    YOUTUBE_URL: http://youtube:8000
    MENTIONS_URL: http://mentions:8000
    STATS_URL: http://stats:8000
    # 관측 프로필을 켜면(--profile observability) 서비스가 여기로 트레이스를 보낸다. 컬렉터가 없으면 조용히 실패한다.
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  market-data:
    <<: *common
    build: { context: ../.., dockerfile: services/market-data/Dockerfile }
    environment: { <<: *env, DATABASE_URL: sqlite:////data/market-data.db }
    volumes: [market-data:/data]
    ports: ["8001:8000"]

  youtube:
    <<: *common
    build: { context: ../.., dockerfile: services/youtube/Dockerfile }
    environment: { <<: *env, DATABASE_URL: sqlite:////data/youtube.db, YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-} }
    volumes: [youtube:/data]
    ports: ["8002:8000"]

  mentions:
    <<: *common
    build: { context: ../.., dockerfile: services/mentions/Dockerfile }
    environment: { <<: *env, DATABASE_URL: sqlite:////data/mentions.db }
    volumes: [mentions:/data]
    ports: ["8003:8000"]
    depends_on: [youtube, market-data]

  stats:
    <<: *common
    build: { context: ../.., dockerfile: services/stats/Dockerfile }
    environment: { <<: *env, DATABASE_URL: sqlite:////data/stats.db }
    volumes: [stats:/data]
    ports: ["8004:8000"]
    depends_on: [mentions, market-data]

  # ── 세미나 트랙: 게이트웨이 (docker compose --profile gateway up) ──
  apisix:
    image: apache/apisix:3.11.0-debian
    profiles: [gateway]
    # standalone 모드는 config.yaml 의 deployment.role_data_plane.config_provider: yaml 로 켠다
    # (APISIX_STAND_ALONE 환경변수를 쓰면 엔트리포인트가 config.yaml 을 덮어써 :ro 마운트와 충돌한다)
    volumes:
      - ../gateway/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ../gateway/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports: ["9080:9080", "9091:9091"]
    depends_on: [market-data, youtube, mentions, stats]

  # ── 세미나 트랙: 관측 (docker compose --profile observability up) ──
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: [observability]
    command: ["--config=/etc/otel/config.yaml"]
    volumes: [./otel-collector.yaml:/etc/otel/config.yaml:ro]
    ports: ["4318:4318", "8889:8889"]
    depends_on: [tempo]

  tempo:
    image: grafana/tempo:2.6.1
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: [./tempo.yaml:/etc/tempo.yaml:ro, tempo:/var/tempo]
    ports: ["3200:3200"]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes: [./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro]
    ports: ["3000:3000"]
    depends_on: [tempo, prometheus]

volumes:
  tempo: {}
  market-data: {}
  youtube: {}
  mentions: {}
  stats: {}
