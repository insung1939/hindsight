# Grafana 데이터소스 자동 등록 — Tempo(트레이스) + Prometheus(메트릭)
apiVersion: 1
datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    isDefault: true
    jsonData:
      tracesToMetrics:
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
