# Apache APISIX standalone 설정 — 세미나 2번 항목 (North-South 게이트웨이).
# 프론트는 서비스 주소 4개 대신 게이트웨이 하나만 안다: http://localhost:9080/api/<service>/v1/...
#
#   Before: 프론트 → 서비스 4개 직접 호출, 인증·속도제한 없음, /internal/sync 가 외부에 노출
#   After : 프론트 → APISIX → 서비스.  키 인증(key-auth) · 분당 호출 제한(limit-count) · 경로 재작성 · CORS · 메트릭 을 한곳에서
#
# 주의: APISIX uri 와일드카드는 끝에만 가능하다. 서비스별로 나열한다.
routes:
  - id: market-data
    uri: /api/market-data/*
    upstream_id: market-data
    plugins:
      proxy-rewrite: { regex_uri: ["^/api/market-data/(.*)", "/$1"] }
      key-auth: {}
      limit-count: { count: 120, time_window: 60, key_type: var, key: remote_addr, rejected_code: 429 }
      cors: { allow_origins: "**", allow_methods: "GET,POST,PATCH,DELETE,OPTIONS", allow_headers: "*", expose_headers: "X-Request-ID" }
      prometheus: {}
  - id: youtube
    uri: /api/youtube/*
    upstream_id: youtube
    plugins:
      proxy-rewrite: { regex_uri: ["^/api/youtube/(.*)", "/$1"] }
      key-auth: {}
      limit-count: { count: 60, time_window: 60, key_type: var, key: remote_addr, rejected_code: 429 }
      cors: { allow_origins: "**", allow_methods: "GET,POST,OPTIONS", allow_headers: "*", expose_headers: "X-Request-ID" }
      prometheus: {}
  - id: mentions
    uri: /api/mentions/*
    upstream_id: mentions
    plugins:
      proxy-rewrite: { regex_uri: ["^/api/mentions/(.*)", "/$1"] }
      key-auth: {}
      limit-count: { count: 120, time_window: 60, key_type: var, key: remote_addr, rejected_code: 429 }
      cors: { allow_origins: "**", allow_methods: "GET,OPTIONS", allow_headers: "*", expose_headers: "X-Request-ID" }
      prometheus: {}
  - id: stats
    uri: /api/stats/*
    upstream_id: stats
    plugins:
      proxy-rewrite: { regex_uri: ["^/api/stats/(.*)", "/$1"] }
      key-auth: {}
      limit-count: { count: 120, time_window: 60, key_type: var, key: remote_addr, rejected_code: 429 }
      cors: { allow_origins: "**", allow_methods: "GET,OPTIONS", allow_headers: "*", expose_headers: "X-Request-ID" }
      prometheus: {}
  # ── /internal/* 은 외부에서 차단 ──
  - id: block-internal
    uris: [/api/market-data/internal/*, /api/youtube/internal/*, /api/mentions/internal/*, /api/stats/internal/*]
    priority: 10
    plugins:
      response-rewrite:
        status_code: 403
        headers: { Content-Type: application/problem+json }
        body: '{"type":"about:blank","title":"Forbidden","status":403,"detail":"internal endpoints are not exposed"}'
    upstream_id: market-data
  # ── 헬스체크는 키 없이 ──
  - { id: healthz-market-data, uri: /api/market-data/healthz, priority: 5, plugins: { proxy-rewrite: { uri: /healthz } }, upstream_id: market-data }
  - { id: healthz-youtube, uri: /api/youtube/healthz, priority: 5, plugins: { proxy-rewrite: { uri: /healthz } }, upstream_id: youtube }
  - { id: healthz-mentions, uri: /api/mentions/healthz, priority: 5, plugins: { proxy-rewrite: { uri: /healthz } }, upstream_id: mentions }
  - { id: healthz-stats, uri: /api/stats/healthz, priority: 5, plugins: { proxy-rewrite: { uri: /healthz } }, upstream_id: stats }

upstreams:
  - id: market-data
    nodes: { "market-data:8000": 1 }
    type: roundrobin
    checks: { active: { http_path: /healthz, healthy: { interval: 10, successes: 1 }, unhealthy: { interval: 10, http_failures: 3 } } }
  - { id: youtube, nodes: { "youtube:8000": 1 }, type: roundrobin }
  - { id: mentions, nodes: { "mentions:8000": 1 }, type: roundrobin }
  - { id: stats, nodes: { "stats:8000": 1 }, type: roundrobin }

consumers:
  - username: web
    plugins:
      key-auth: { key: hindsight-web-dev-key }
  - username: seminar_demo
    plugins:
      key-auth: { key: hindsight-demo-key }

#END
