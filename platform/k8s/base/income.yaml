apiVersion: apps/v1
kind: Deployment
metadata:
  name: income
  namespace: routine
  labels: { app: income, part-of: routine }
spec:
  replicas: 1
  selector:
    matchLabels: { app: income }
  template:
    metadata:
      labels: { app: income, part-of: routine }
    spec:
      containers:
        - name: income
          image: ghcr.io/insung1939/routine-incomeatest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: routine-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: routine-secrets, key: DATABASE_URL_INCOME } }
            - name: INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: routine-secrets, key: INTERNAL_TOKEN } }
            - name: DATA_GO_KR_KEY
              valueFrom: { secretKeyRef: { name: routine-secrets, key: DATA_GO_KR_KEY, optional: true } }
            - name: KOREAEXIM_KEY
              valueFrom: { secretKeyRef: { name: routine-secrets, key: KOREAEXIM_KEY, optional: true } }
            - name: DART_KEY
              valueFrom: { secretKeyRef: { name: routine-secrets, key: DART_KEY, optional: true } }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          emptyDir: {}   # SQLite 데모용. Supabase 를 쓰면 필요 없다.
---
apiVersion: v1
kind: Service
metadata:
  name: income
  namespace: routine
  labels: { app: income }
spec:
  selector: { app: income }
  ports: [{ port: 8000, targetPort: 8000 }]
