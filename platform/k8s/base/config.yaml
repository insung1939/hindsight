# 서비스 간 주소는 k8s Service DNS. Secret 은 secret.example.yaml 을 복사해 실제 값으로 만든다 (커밋 금지).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hindsight-config
  namespace: hindsight
data:
  ALLOWED_ORIGINS: "http://localhost:5173,https://hindsight.vercel.app"
  MARKET_DATA_URL: "http://market-data.hindsight.svc.cluster.local:8000"
  YOUTUBE_URL: "http://youtube.hindsight.svc.cluster.local:8000"
  MENTIONS_URL: "http://mentions.hindsight.svc.cluster.local:8000"
  STATS_URL: "http://stats.hindsight.svc.cluster.local:8000"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.hindsight.svc.cluster.local:4318"
