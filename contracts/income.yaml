openapi: 3.1.0
info:
  title: 루틴 income
  description: '배당·분배금 이력과 월별 현금흐름 합산. 출처: DART OpenAPI, ETF 운용사 페이지(크롤링), 수동 입력.'
  contact:
    name: income owner
    url: https://github.com/insung1939/routine
  version: 0.1.0
  x-owner: team-income
  x-service: income
paths:
  /healthz:
    get:
      tags:
      - ops
      summary: 서비스 상태
      operationId: healthz
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
  /v1/distributions:
    get:
      tags:
      - distributions
      summary: 배당·분배금 이력
      operationId: list_distributions
      parameters:
      - name: asset_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Asset Id
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: To
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOf'
        '422':
          description: Validation Error
          content: &id001
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: 서버 내부 오류
          content: *id001
    post:
      tags:
      - distributions
      summary: 분배 이벤트 수동 등록 (수집기가 못 잡은 것)
      operationId: create_distribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistributionIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionOut'
        '422':
          description: Validation Error
          content: *id001
        '500':
          description: 서버 내부 오류
          content: *id001
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
  /v1/cashflow:
    post:
      tags:
      - cashflow
      summary: 보유 수량 기준 연간 월별 분배금 (원화 환산, market-data 호출)
      operationId: calc_cashflow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashflowIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashflowOut'
        '422':
          description: Validation Error
          content: *id001
        '500':
          description: 서버 내부 오류
          content: *id001
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
  /internal/sync:
    post:
      tags:
      - ops
      summary: 분배금 수집 (5~6주차에 DART·운용사 크롤러 연결)
      operationId: sync_income
      parameters:
      - name: X-Internal-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Internal-Token
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '422':
          description: Validation Error
          content: *id001
        '500':
          description: 서버 내부 오류
          content: *id001
components:
  schemas:
    CashflowIn:
      properties:
        holdings:
          items:
            $ref: '#/components/schemas/HoldingRef'
          type: array
          title: Holdings
        year:
          type: integer
          maximum: 2100.0
          minimum: 2000.0
          title: Year
      type: object
      required:
      - holdings
      - year
      title: CashflowIn
    CashflowMonth:
      properties:
        month:
          type: string
          title: Month
        amount_krw:
          type: number
          title: Amount Krw
        items:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Items
      type: object
      required:
      - month
      - amount_krw
      - items
      title: CashflowMonth
    CashflowOut:
      properties:
        year:
          type: integer
          title: Year
        total_krw:
          type: number
          title: Total Krw
        months:
          items:
            $ref: '#/components/schemas/CashflowMonth'
          type: array
          title: Months
        warnings:
          items:
            type: string
          type: array
          title: Warnings
      type: object
      required:
      - year
      - total_krw
      - months
      - warnings
      title: CashflowOut
    DistributionIn:
      properties:
        asset_id:
          type: string
          title: Asset Id
        ex_date:
          type: string
          format: date
          title: Ex Date
        pay_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Pay Date
        amount_per_unit:
          type: number
          exclusiveMinimum: 0.0
          title: Amount Per Unit
        currency:
          type: string
          maxLength: 3
          minLength: 3
          title: Currency
        kind:
          type: string
          pattern: ^(cash|stock)$
          title: Kind
          default: cash
        source:
          type: string
          title: Source
          default: manual
      type: object
      required:
      - asset_id
      - ex_date
      - amount_per_unit
      - currency
      title: DistributionIn
    DistributionOut:
      properties:
        asset_id:
          type: string
          title: Asset Id
        ex_date:
          type: string
          format: date
          title: Ex Date
        pay_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Pay Date
        amount_per_unit:
          type: number
          exclusiveMinimum: 0.0
          title: Amount Per Unit
        currency:
          type: string
          maxLength: 3
          minLength: 3
          title: Currency
        kind:
          type: string
          pattern: ^(cash|stock)$
          title: Kind
          default: cash
        source:
          type: string
          title: Source
          default: manual
        id:
          type: integer
          title: Id
      type: object
      required:
      - asset_id
      - ex_date
      - amount_per_unit
      - currency
      - id
      title: DistributionOut
    HoldingRef:
      properties:
        asset_id:
          type: string
          title: Asset Id
        quantity:
          type: number
          minimum: 0.0
          title: Quantity
      type: object
      required:
      - asset_id
      - quantity
      title: HoldingRef
    ListOf:
      properties:
        items:
          items:
            $ref: '#/components/schemas/DistributionOut'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      title: ListOf
    SyncResult:
      properties:
        upserted:
          type: integer
          title: Upserted
        skipped:
          items:
            type: string
          type: array
          title: Skipped
      type: object
      required:
      - upserted
      - skipped
      title: SyncResult
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required:
      - type
      - title
      - status
tags:
- name: cashflow
- name: distributions
- name: ops
servers:
- url: http://localhost:8002
  description: 로컬
- url: https://routine-income.onrender.com
  description: Render (팀 운영)
