openapi: 3.1.0
info:
  title: 하인드사이트 market-data
  description: '종목 사전(국내·미국·코인·지수 + 별칭) · 일별 시세. 출처: DART corpCode, 공공데이터포털, Yahoo
    Finance, 업비트.'
  contact:
    name: market-data owner
    url: https://github.com/insung1939/hindsight
  version: 0.2.0
  x-owner: team-market-data
  x-service: market-data
paths:
  /healthz:
    get:
      tags:
      - ops
      summary: 서비스 상태
      operationId: healthz
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
  /v1/dictionary:
    get:
      tags:
      - dictionary
      summary: 종목 사전 전체 (이름·별칭 → asset_id). mentions 서비스가 매칭에 쓴다
      operationId: get_dictionary
      parameters:
      - name: market
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Market
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDictionary'
        '422':
          description: Validation Error
          content: &id001
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: 서버 내부 오류
          content: *id001
  /v1/assets:
    get:
      tags:
      - assets
      summary: 자산 목록
      operationId: list_assets
      parameters:
      - name: market
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Market
      - name: tracked
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Tracked
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 이름·별칭 검색
          title: Q
        description: 이름·별칭 검색
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          default: 200
          title: Limit
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAssets'
        '422':
          description: Validation Error
          content: *id001
        '500':
          description: 서버 내부 오류
          content: *id001
  /v1/assets/names:
    get:
      tags:
      - assets
      summary: 화면용 가벼운 사전 — 언급된 적 있는(tracked) 종목·테마·지수의 이름·별칭만
      operationId: list_asset_names
      parameters:
      - name: all
        in: query
        required: false
        schema:
          type: boolean
          description: true 면 사전 전체(4천여 개)
          default: false
          title: All
        description: true 면 사전 전체(4천여 개)
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAssetNames'
        '422':
          description: Validation Error
          content: *id001
        '500':
          description: 서버 내부 오류
          content: *id001
  /v1/assets/{asset_id}:
    get:
      tags:
      - assets
      summary: 자산 하나
      operationId: get_asset
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetOut'
        '422':
          description: Validation Error
          content: *id001
        '500':
          description: 서버 내부 오류
          content: *id001
        '404':
          description: 대상 없음
          content: *id001
  /v1/assets/{asset_id}/track:
    post:
      tags:
      - assets
      summary: 시세 수집 대상으로 켠다 (mentions 가 새 종목을 발견했을 때 호출)
      operationId: track_asset
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetOut'
        '422':
          description: Validation Error
          content: *id001
        '500':
          description: 서버 내부 오류
          content: *id001
        '404':
          description: 대상 없음
          content: *id001
  /v1/assets/{asset_id}/prices:
    get:
      tags:
      - prices
      summary: 일별 종가 이력
      operationId: list_prices
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          title: Asset Id
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: To
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          default: 500
          title: Limit
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPrices'
        '422':
          description: Validation Error
          content: *id001
        '500':
          description: 서버 내부 오류
          content: *id001
        '404':
          description: 대상 없음
          content: *id001
  /v1/prices:
    get:
      tags:
      - prices
      summary: 여러 종목 시세를 한 번에 (stats 서비스용). asset_ids 는 쉼표 구분
      operationId: batch_prices
      parameters:
      - name: asset_ids
        in: query
        required: true
        schema:
          type: string
          title: Asset Ids
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: To
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPrices'
        '422':
          description: Validation Error
          content: *id001
        '500':
          description: 서버 내부 오류
          content: *id001
  /v1/disclosures:
    get:
      tags:
      - attention
      summary: DART 공시 (asset_ids 쉼표 구분, 기간). stats 가 '언급 전후 공시 여부' 에, 타임라인이 표시에 쓴다
      operationId: list_disclosures
      parameters:
      - name: asset_ids
        in: query
        required: true
        schema:
          type: string
          title: Asset Ids
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: To
      - name: kind
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Kind
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 20000
          default: 2000
          title: Limit
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDisclosures'
        '422':
          description: Validation Error
          content: *id001
        '500':
          description: 서버 내부 오류
          content: *id001
  /v1/coverage:
    get:
      tags:
      - ops
      summary: '수집 현황 (데이터 페이지용): 사전·시세·거래량·공시·뉴스 건수'
      operationId: get_market_coverage
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketCoverage'
        '500':
          description: 서버 내부 오류
          content: *id001
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
  /v1/news-daily:
    get:
      tags:
      - attention
      summary: 종목별 일별 뉴스 기사 수 (네이버 금융 크롤링). asset_ids 쉼표 구분, 기간
      operationId: list_news_daily
      parameters:
      - name: asset_ids
        in: query
        required: true
        schema:
          type: string
          title: Asset Ids
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: To
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50000
          default: 5000
          title: Limit
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNewsDaily'
        '422':
          description: Validation Error
          content: *id001
        '500':
          description: 서버 내부 오류
          content: *id001
  /internal/sync-attention:
    post:
      tags:
      - ops
      summary: tracked 국내 종목의 DART 공시(days 소급) + 네이버 증권 뉴스 크롤링(news_days, 0 이면 건너뜀).
        background=true 면 즉시 응답, /internal/sync-attention-status 로 확인
      operationId: sync_attention
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 800
          default: 7
          title: Days
      - name: news_days
        in: query
        required: false
        schema:
          type: integer
          maximum: 30
          description: 뉴스 크롤링 소급 일수. 0 이면 안 함
          default: 7
          title: News Days
        description: 뉴스 크롤링 소급 일수. 0 이면 안 함
      - name: news_limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          description: 크롤링할 종목 수 상한(국내 추적 종목 순)
          default: 100
          title: News Limit
        description: 크롤링할 종목 수 상한(국내 추적 종목 순)
      - name: background
        in: query
        required: false
        schema:
          type: boolean
          description: true 면 백그라운드 (Render 는 15분 넘는 요청을 끊는다)
          default: false
          title: Background
        description: true 면 백그라운드 (Render 는 15분 넘는 요청을 끊는다)
      - name: X-Internal-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Internal-Token
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttentionSyncResult'
        '422':
          description: Validation Error
          content: *id001
        '500':
          description: 서버 내부 오류
          content: *id001
  /internal/sync-attention-status:
    get:
      tags:
      - ops
      summary: 비동기 공시·뉴스 수집 상태
      operationId: attention_sync_status
      parameters:
      - name: X-Internal-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Internal-Token
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '422':
          description: Validation Error
          content: *id001
        '500':
          description: 서버 내부 오류
          content: *id001
  /internal/sync:
    post:
      tags:
      - ops
      summary: 사전 갱신(DART·업비트) + tracked 종목 시세 수집
      operationId: sync_market_data
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          default: 400
          title: Days
      - name: dictionary
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Dictionary
      - name: X-Internal-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Internal-Token
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '422':
          description: Validation Error
          content: *id001
        '500':
          description: 서버 내부 오류
          content: *id001
components:
  schemas:
    AssetName:
      properties:
        asset_id:
          type: string
          title: Asset Id
        name:
          type: string
          title: Name
        market:
          type: string
          title: Market
        symbol:
          type: string
          title: Symbol
        asset_type:
          type: string
          title: Asset Type
        benchmark_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Benchmark Id
        aliases:
          items:
            type: string
          type: array
          title: Aliases
          default: []
      type: object
      required:
      - asset_id
      - name
      - market
      - symbol
      - asset_type
      title: AssetName
    AssetOut:
      properties:
        asset_id:
          type: string
          title: Asset Id
        market:
          type: string
          title: Market
        symbol:
          type: string
          title: Symbol
        name:
          type: string
          title: Name
        aliases:
          items:
            type: string
          type: array
          title: Aliases
        currency:
          type: string
          title: Currency
        asset_type:
          type: string
          title: Asset Type
        benchmark_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Benchmark Id
        tracked:
          type: boolean
          title: Tracked
      type: object
      required:
      - asset_id
      - market
      - symbol
      - name
      - aliases
      - currency
      - asset_type
      - tracked
      title: AssetOut
    AttentionSyncResult:
      properties:
        disclosures_added:
          type: integer
          title: Disclosures Added
        news_rows_upserted:
          type: integer
          title: News Rows Upserted
          default: 0
        assets_scanned:
          type: integer
          title: Assets Scanned
        skipped:
          items:
            type: string
          type: array
          title: Skipped
      type: object
      required:
      - disclosures_added
      - assets_scanned
      - skipped
      title: AttentionSyncResult
    BatchPrices:
      properties:
        series:
          items:
            $ref: '#/components/schemas/PriceSeries'
          type: array
          title: Series
        missing:
          items:
            type: string
          type: array
          title: Missing
      type: object
      required:
      - series
      - missing
      title: BatchPrices
    DictionaryEntry:
      properties:
        asset_id:
          type: string
          title: Asset Id
        name:
          type: string
          title: Name
        aliases:
          items:
            type: string
          type: array
          title: Aliases
        market:
          type: string
          title: Market
        asset_type:
          type: string
          title: Asset Type
          default: stock
        ambiguous:
          type: boolean
          title: Ambiguous
        curated:
          type: boolean
          title: Curated
      type: object
      required:
      - asset_id
      - name
      - aliases
      - market
      - ambiguous
      - curated
      title: DictionaryEntry
    DisclosureOut:
      properties:
        rcept_no:
          type: string
          title: Rcept No
        asset_id:
          type: string
          title: Asset Id
        rcept_dt:
          type: string
          format: date
          title: Rcept Dt
        report_nm:
          type: string
          title: Report Nm
        kind:
          type: string
          title: Kind
      type: object
      required:
      - rcept_no
      - asset_id
      - rcept_dt
      - report_nm
      - kind
      title: DisclosureOut
    JobStatus:
      properties:
        state:
          type: string
          title: State
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - state
      title: JobStatus
    ListAssetNames:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AssetName'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      title: ListAssetNames
    ListAssets:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AssetOut'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      title: ListAssets
    ListDictionary:
      properties:
        items:
          items:
            $ref: '#/components/schemas/DictionaryEntry'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
        ambiguous_names:
          items:
            type: string
          type: array
          title: Ambiguous Names
      type: object
      required:
      - items
      - ambiguous_names
      title: ListDictionary
    ListDisclosures:
      properties:
        items:
          items:
            $ref: '#/components/schemas/DisclosureOut'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
