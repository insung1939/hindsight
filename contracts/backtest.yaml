openapi: 3.1.0
info:
  title: 루틴 backtest
  description: 적립식 타임머신과 신화 검증(매수일 타이밍 등).
  contact:
    name: backtest owner
    url: https://github.com/insung1939/routine
  version: 0.1.0
  x-owner: team-backtest
  x-service: backtest
paths:
  /healthz:
    get:
      tags:
      - ops
      summary: 서비스 상태
      operationId: healthz
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
  /v1/runs:
    post:
      tags:
      - runs
      summary: 적립식 타임머신 (market-data 호출)
      operationId: create_run
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DcaIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOut'
        '422':
          description: Validation Error
          content: &id001
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: 서버 내부 오류
          content: *id001
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
  /v1/runs/{run_id}:
    get:
      tags:
      - runs
      summary: 실행 결과 하나
      operationId: get_run
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: integer
          title: Run Id
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOut'
        '422':
          description: Validation Error
          content: *id001
        '500':
          description: 서버 내부 오류
          content: *id001
        '404':
          description: 대상 없음
          content: *id001
  /v1/analyses/purchase-day:
    get:
      tags:
      - analyses
      summary: 신화 검증 1 — 매수일이 결과를 바꾸는가
      operationId: analyze_purchase_day
      parameters:
      - name: asset_id
        in: query
        required: true
        schema:
          type: string
          title: Asset Id
      - name: start
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Start
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: End
      - name: monthly_amount_krw
        in: query
        required: false
        schema:
          type: number
          exclusiveMinimum: 0
          default: 100000
          title: Monthly Amount Krw
      - name: X-Request-ID
        in: header
        required: false
        schema:
          type: string
        description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려준다.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseDayOut'
        '422':
          description: Validation Error
          content: *id001
        '500':
          description: 서버 내부 오류
          content: *id001
components:
  schemas:
    DcaIn:
      properties:
        weights:
          additionalProperties:
            type: number
          type: object
          title: Weights
          description: asset_id → 비중, 합이 1
          examples:
          - CRYPTO:KRW-BTC: 0.4
            US:SPY: 0.6
        monthly_amount_krw:
          type: number
          exclusiveMinimum: 0.0
          title: Monthly Amount Krw
        start:
          type: string
          format: date
          title: Start
        end:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: End
        buy_day:
          type: integer
          maximum: 28.0
          minimum: 1.0
          title: Buy Day
          default: 1
      type: object
      required:
      - weights
      - monthly_amount_krw
      - start
      title: DcaIn
    PurchaseDayOut:
      properties:
        asset_id:
          type: string
          title: Asset Id
        start:
          type: string
          format: date
          title: Start
        end:
          type: string
          format: date
          title: End
        monthly_amount_krw:
          type: number
          title: Monthly Amount Krw
        by_day:
          items:
            additionalProperties: true
            type: object
          type: array
          title: By Day
        best_day:
          type: integer
          title: Best Day
        worst_day:
          type: integer
          title: Worst Day
        spread_pct:
          type: number
          title: Spread Pct
        conclusion:
          type: string
          title: Conclusion
      type: object
      required:
      - asset_id
      - start
      - end
      - monthly_amount_krw
      - by_day
      - best_day
      - worst_day
      - spread_pct
      - conclusion
      title: PurchaseDayOut
    RunOut:
      properties:
        id:
          type: integer
          title: Id
        kind:
          type: string
          title: Kind
        params:
          additionalProperties: true
          type: object
          title: Params
        result:
          additionalProperties: true
          type: object
          title: Result
      type: object
      required:
      - id
      - kind
      - params
      - result
      title: RunOut
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required:
      - type
      - title
      - status
tags:
- name: analyses
- name: ops
- name: runs
servers:
- url: http://localhost:8005
  description: 로컬
- url: https://routine-backtest.onrender.com
  description: Render (팀 운영)
