components:
  schemas:
    AccountIn:
      properties:
        name:
          type: string
          title: Name
        account_type:
          type: string
          pattern: ^(general|isa|pension|exchange)$
          title: Account Type
        broker:
          anyOf:
          - type: string
          - type: 'null'
          title: Broker
      type: object
      required:
      - name
      - account_type
      title: AccountIn
    AccountOut:
      properties:
        name:
          type: string
          title: Name
        account_type:
          type: string
          pattern: ^(general|isa|pension|exchange)$
          title: Account Type
        broker:
          anyOf:
          - type: string
          - type: 'null'
          title: Broker
        id:
          type: integer
          title: Id
        portfolio_id:
          type: integer
          title: Portfolio Id
      type: object
      required:
      - name
      - account_type
      - id
      - portfolio_id
      title: AccountOut
    Compliance:
      properties:
        portfolio_id:
          type: integer
          title: Portfolio Id
        months:
          type: integer
          title: Months
        done:
          type: integer
          title: Done
        skipped:
          type: integer
          title: Skipped
        extra:
          type: integer
          title: Extra
        sell:
          type: integer
          title: Sell
        score:
          type: number
          title: Score
        streak_months:
          type: integer
          title: Streak Months
      type: object
      required:
      - portfolio_id
      - months
      - done
      - skipped
      - extra
      - sell
      - score
      - streak_months
      title: Compliance
    ExecutionIn:
      properties:
        instruction_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Instruction Id
        asset_id:
          type: string
          title: Asset Id
        executed_on:
          type: string
          format: date
          title: Executed On
        status:
          type: string
          pattern: ^(done|skipped|extra|sell)$
          title: Status
        amount_krw:
          type: number
          title: Amount Krw
          default: 0
        quantity:
          type: number
          title: Quantity
          default: 0
        note:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Note
      type: object
      required:
      - asset_id
      - executed_on
      - status
      title: ExecutionIn
    ExecutionOut:
      properties:
        instruction_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Instruction Id
        asset_id:
          type: string
          title: Asset Id
        executed_on:
          type: string
          format: date
          title: Executed On
        status:
          type: string
          pattern: ^(done|skipped|extra|sell)$
          title: Status
        amount_krw:
          type: number
          title: Amount Krw
          default: 0
        quantity:
          type: number
          title: Quantity
          default: 0
        note:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Note
        id:
          type: integer
          title: Id
        portfolio_id:
          type: integer
          title: Portfolio Id
      type: object
      required:
      - asset_id
      - executed_on
      - status
      - id
      - portfolio_id
      title: ExecutionOut
    HoldingIn:
      properties:
        account_id:
          type: integer
          title: Account Id
        asset_id:
          type: string
          title: Asset Id
        quantity:
          type: number
          minimum: 0.0
          title: Quantity
        avg_cost:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Cost
      type: object
      required:
      - account_id
      - asset_id
      - quantity
      title: HoldingIn
    HoldingOut:
      properties:
        account_id:
          type: integer
          title: Account Id
        asset_id:
          type: string
          title: Asset Id
        quantity:
          type: number
          minimum: 0.0
          title: Quantity
        avg_cost:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Cost
        id:
          type: integer
          title: Id
        portfolio_id:
          type: integer
          title: Portfolio Id
      type: object
      required:
      - account_id
      - asset_id
      - quantity
      - id
      - portfolio_id
      title: HoldingOut
    HoldingPatch:
      properties:
        quantity:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Quantity
        avg_cost:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Cost
      type: object
      title: HoldingPatch
    ListOf:
      properties:
        items:
          items: {}
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      title: ListOf
    PortfolioIn:
      properties:
        owner:
          type: string
          maxLength: 50
          minLength: 1
          title: Owner
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        base_currency:
          type: string
          title: Base Currency
          default: KRW
        monthly_budget:
          type: number
          minimum: 0.0
          title: Monthly Budget
          default: 0
        buy_day:
          type: integer
          maximum: 28.0
          minimum: 1.0
          title: Buy Day
          default: 1
      type: object
      required:
      - owner
      - name
      title: PortfolioIn
    PortfolioOut:
      properties:
        owner:
          type: string
          maxLength: 50
          minLength: 1
          title: Owner
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        base_currency:
          type: string
          title: Base Currency
          default: KRW
        monthly_budget:
          type: number
          minimum: 0.0
          title: Monthly Budget
          default: 0
        buy_day:
          type: integer
          maximum: 28.0
