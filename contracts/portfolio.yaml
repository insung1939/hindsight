openapi: 3.1.0
info:
  title: 루틴 portfolio
  description: 포트폴리오 · 계좌 · 보유 · 적립 규칙 · 실행 기록. 평가액과 규칙 준수 점수를 계산한다.
  contact:
    name: portfolio owner
    url: https://github.com/insung1939/routine
  version: 0.1.0
  x-owner: team-portfolio
  x-service: portfolio
