# Render Blueprint — New → Blueprint 에서 이 저장소를 고르면 서비스 4개가 한 번에 만들어진다. (docs/deploy.md)
# sync: false 항목은 대시보드에서 직접 넣는다.
#   DATABASE_URL     = Supabase Session pooler 주소 (4개 전부 같은 값, 스키마는 서비스가 만든다)
#   ALLOWED_ORIGINS  = Vercel 주소 (끝에 / 없이)
#   INTERNAL_TOKEN   = 4개 전부 같은 값. GitHub Secrets 의 INTERNAL_TOKEN 과 동일하게.
#   YOUTUBE_API_KEY  = youtube 서비스만
services:
  - type: web
    name: hindsight-market-data
    runtime: docker
    plan: free
    dockerfilePath: ./services/market-data/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - { key: DATABASE_URL, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
      - { key: INTERNAL_TOKEN, sync: false }
      - { key: DATA_GO_KR_KEY, sync: false }
      - { key: DART_KEY, sync: false }

  - type: web
    name: hindsight-youtube
    runtime: docker
    plan: free
    dockerfilePath: ./services/youtube/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - { key: DATABASE_URL, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
      - { key: INTERNAL_TOKEN, sync: false }
      - { key: YOUTUBE_API_KEY, sync: false }

  - type: web
    name: hindsight-mentions
    runtime: docker
    plan: free
    dockerfilePath: ./services/mentions/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - { key: DATABASE_URL, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
      - { key: INTERNAL_TOKEN, sync: false }
      - key: MARKET_DATA_URL
        fromService: { type: web, name: hindsight-market-data, property: host }
      - key: YOUTUBE_URL
        fromService: { type: web, name: hindsight-youtube, property: host }

  - type: web
    name: hindsight-stats
    runtime: docker
    plan: free
    dockerfilePath: ./services/stats/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - { key: DATABASE_URL, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
      - { key: INTERNAL_TOKEN, sync: false }
      - key: MARKET_DATA_URL
        fromService: { type: web, name: hindsight-market-data, property: host }
      - key: MENTIONS_URL
        fromService: { type: web, name: hindsight-mentions, property: host }
