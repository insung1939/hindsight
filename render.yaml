# Render Blueprint — 대시보드 New → Blueprint 에서 이 저장소를 고르면 서비스 5개가 한 번에 만들어진다.
# 무료 플랜: 15분 미사용 시 슬립(콜드 스타트 30~60초). sync: false 항목은 대시보드에서 직접 넣는다.
#   DATABASE_URL     = Supabase Session pooler 주소 (서비스별 스키마 권한 계정 권장, PLAN.md 4.4)
#   ALLOWED_ORIGINS  = Vercel 주소 (끝에 / 없이)
#   INTERNAL_TOKEN   = 다섯 서비스에 같은 값. GitHub Secrets 의 INTERNAL_TOKEN 과 동일하게.
services:
  - type: web
    name: routine-market-data
    runtime: docker
    plan: free
    dockerfilePath: ./services/market-data/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - { key: DATABASE_URL, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
      - { key: INTERNAL_TOKEN, sync: false }
      - { key: DATA_GO_KR_KEY, sync: false }
      - { key: KOREAEXIM_KEY, sync: false }

  - type: web
    name: routine-income
    runtime: docker
    plan: free
    dockerfilePath: ./services/income/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - { key: DATABASE_URL, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
      - { key: INTERNAL_TOKEN, sync: false }
      - { key: DART_KEY, sync: false }
      - key: MARKET_DATA_URL
        fromService: { type: web, name: routine-market-data, property: host }

  - type: web
    name: routine-portfolio
    runtime: docker
    plan: free
    dockerfilePath: ./services/portfolio/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - { key: DATABASE_URL, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
      - key: MARKET_DATA_URL
        fromService: { type: web, name: routine-market-data, property: host }

  - type: web
    name: routine-plan
    runtime: docker
    plan: free
    dockerfilePath: ./services/plan/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - { key: DATABASE_URL, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
      - key: MARKET_DATA_URL
        fromService: { type: web, name: routine-market-data, property: host }
      - key: PORTFOLIO_URL
        fromService: { type: web, name: routine-portfolio, property: host }

  - type: web
    name: routine-backtest
    runtime: docker
    plan: free
    dockerfilePath: ./services/backtest/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - { key: DATABASE_URL, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
      - key: MARKET_DATA_URL
        fromService: { type: web, name: routine-market-data, property: host }
      - key: INCOME_URL
        fromService: { type: web, name: routine-income, property: host }
      - key: PORTFOLIO_URL
        fromService: { type: web, name: routine-portfolio, property: host }
