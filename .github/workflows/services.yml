# 서비스 CI — 테스트(계약 드리프트 포함) → main 이면 Docker 이미지를 GHCR 에 올린다.
# 같은 이미지를 Render(팀 운영)와 k8s(세미나)가 쓴다.
name: services

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [market-data, income, portfolio, plan, backtest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -e libs/routine-common -r services/${{ matrix.service }}/requirements.txt pytest pyyaml
      - name: pytest (명세 드리프트 검사 포함)
        working-directory: services/${{ matrix.service }}
        run: python -m pytest -q

  image:
    name: image (${{ matrix.service }})
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [market-data, income, portfolio, plan, backtest]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/routine-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/routine-${{ matrix.service }}:${{ github.sha }}
