# 수집 스케줄 — Render 무료 플랜엔 크론이 없으므로 GitHub Actions 가 매일 각 서비스의 /internal/sync 를 부른다.
# Secrets: MARKET_DATA_URL, INCOME_URL (https://….onrender.com), INTERNAL_TOKEN
name: sync

on:
  schedule:
    - cron: "10 22 * * *"   # 매일 07:10 KST
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
      INCOME_URL: ${{ secrets.INCOME_URL }}
      INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
    steps:
      - name: market-data
        if: env.MARKET_DATA_URL != ''
        run: |
          curl -sS --max-time 300 --retry 3 --retry-delay 30 -X POST \
            -H "X-Internal-Token: $INTERNAL_TOKEN" "$MARKET_DATA_URL/internal/sync?days=30"
      - name: income
        if: env.INCOME_URL != ''
        run: |
          curl -sS --max-time 300 --retry 3 --retry-delay 30 -X POST \
            -H "X-Internal-Token: $INTERNAL_TOKEN" "$INCOME_URL/internal/sync"
      - name: skipped
        if: env.MARKET_DATA_URL == ''
        run: echo "MARKET_DATA_URL secret 이 없어 건너뜀 (Render 배포 후 등록)"
