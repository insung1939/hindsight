[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hs-common"
version = "0.1.0"
description = "힌드사이트 서비스들이 공유하는 최소 공통 코드 (앱 생성, 오류 포맷, 요청 ID, DB, 서비스 간 HTTP 클라이언트)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["hs_common*"]
